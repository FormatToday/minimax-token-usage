name: Release

# 两种触发方式：
#   1. 推送 v* 形式的 tag → 自动构建并发布到 GitHub Releases
#      用法：git tag v1.0.0 && git push origin v1.0.0
#   2. 在 Actions 页面手动点击 Run workflow → 只构建，产物作为 artifact 下载
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win
            os: windows-latest
          - target: mac
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 跳过代码签名与公证（无 Apple Developer ID / 代码签名证书）
          CSC_IDENTITY_AUTO_DISCOVERY: false
        # tag push → 发布到 Release；手动触发 → 只构建不发布
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger → skip publish, only build"
            npm run package:${{ matrix.target }} -- --publish never
          else
            echo "Tag push → build and publish to GitHub Releases"
            npm run package:${{ matrix.target }} -- --publish always
          fi

      # 手动触发时这是获取安装包的主途径；tag push 时则作为发布失败的兜底
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-build
          if-no-files-found: ignore
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/*.yml